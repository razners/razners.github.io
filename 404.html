<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — ARVEST</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600&family=Onest:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
  <!-- Стили внутри файла: эта страница открывается по любому несуществующему адресу,
       и относительные пути к css/ там не сработают -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; background: #0B0B0D; color: #EFECE6; color-scheme: dark; font-family: "Onest", "Noto Sans Armenian", system-ui, sans-serif; text-align: center; -webkit-font-smoothing: antialiased; }
    b { display: block; font-family: "Unbounded", sans-serif; font-weight: 600; font-size: clamp(96px, 26vw, 200px); line-height: 1; letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 2px #E2475F; }
    .msg { display: grid; gap: 6px; margin: 18px 0 30px; }
    .msg p { margin: 0; font-size: 18px; font-weight: 600; }
    .msg p + p { color: #7E7B75; font-weight: 400; font-size: 16px; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    a { display: inline-flex; align-items: center; min-height: 50px; padding: 0 22px; border-radius: 999px; border: 1px solid rgba(239, 236, 230, .18); color: #EFECE6; text-decoration: none; font-weight: 600; }
    a:first-child { background: #E2475F; border-color: #E2475F; color: #111; }
  </style>
</head>
<body>
  <main>
    <b>404</b>
    <div class="msg">
      <p>Էջը չի գտնվել</p>
      <p lang="ru">Страница не найдена · Page not found</p>
    </div>
    <nav>
      <a href="/" data-home="">Գլխավոր</a>
      <a href="/ru/" data-home="ru/" lang="ru">На главную</a>
      <a href="/en/" data-home="en/" lang="en">Home</a>
    </nav>
  </main>
</body>
</html>
